; Konfigurasi PHP untuk container Render (RAM 512 MB pada free plan)
memory_limit = 192M
max_execution_time = 120
max_input_time = 120

; Upload foto profil (Modul 12): batas aplikasi 5 MB
upload_max_filesize = 6M
post_max_size = 10M
max_file_uploads = 5

; Konversi WebP lewat GD butuh memori tambahan saat resize 512x512
gd.jpeg_ignore_warning = 1

expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
date.timezone = UTC

opcache.enable = 1
opcache.memory_consumption = 96
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.save_comments = 1
