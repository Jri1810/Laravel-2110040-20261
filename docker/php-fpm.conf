[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

; Render free plan hanya 512 MB RAM. 4 worker cukup untuk demo dan
; menyisakan memori untuk nginx + composer saat boot.
pm = dynamic
pm.max_children = 4
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 300

catch_workers_output = yes
decorate_workers_output = no

access.log = /proc/self/fd/1
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"

; Penting: teruskan environment variable dari Render ke PHP
clear_env = no
